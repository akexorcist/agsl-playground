name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug 2>&1 | tee gradle-build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E -A6 "^e: |error:|What went wrong" gradle-build.log | head -80 > build-errors.txt || true
          tail -30 gradle-build.log >> build-errors.txt
          bash .github/ci/annotate.sh error "Build errors" build-errors.txt

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agsl-playground-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publishes each build as its own release (build-1, build-2, ...) so
      # Obtainium detects new versions and you can download from the tablet.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agsl-playground.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create "build-${{ github.run_number }}" agsl-playground.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest

  ui-test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/ci/run-ui-tests.sh

      - name: Report result
        if: always()
        run: |
          {
            echo "== script log =="
            cat ci-script.log 2>/dev/null | head -40 || echo "(no ci-script.log)"
            ls -la
            echo "== test failures =="
            grep -rh -A15 "<failure" app/build/outputs/androidTest-results 2>/dev/null | head -60
            echo "== crashes in logcat =="
            grep -E -A40 "FATAL EXCEPTION|Fatal signal|ANR in" logcat-full.txt 2>/dev/null | head -120
            echo "== gradle tail =="
            tail -40 gradle-ui.log 2>/dev/null
          } > report.txt
          level=notice; [ "${{ job.status }}" = "success" ] || level=error
          bash .github/ci/annotate.sh "$level" "UI test report (${{ job.status }})" report.txt

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs
          path: |
            logcat-full.txt
            gradle-ui.log
            ci-script.log
            app/build/reports/androidTests
