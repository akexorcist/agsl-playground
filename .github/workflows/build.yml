name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agsl-playground-apk
          path: app/build/outputs/apk/debug/*.apk

      # Publishes each build as its own release (build-1, build-2, ...) so
      # Obtainium detects new versions and you can download from the tablet.
      - name: Publish release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agsl-playground.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create "build-${{ github.run_number }}" agsl-playground.apk \
            --title "Build ${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}" \
            --latest
