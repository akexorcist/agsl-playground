name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: agsl-playground-apk
          path: app/build/outputs/apk/debug/*.apk

      # Puts the APK on a "latest" release so you can download it directly
      # from your tablet's browser (no zip to extract).
      - name: Publish to "latest" release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk agsl-playground.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest agsl-playground.apk \
            --title "Latest build" \
            --notes "Built from ${{ github.sha }}" \
            --prerelease
